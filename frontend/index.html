<!DOCTYPE html>
<html lang='eng'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale= 1.0">
    <title>Manchester Transport — Live</title>

    <!--Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Typography: Space Grotesk for display, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        /* Design System: Manchester Transport Live */
        :root {
            /* Color palette */
            --transport-red: #E03C31;
            --signal-amber: #FFB81C;
            --signal-green: #00D9A5;
            --slate-950: #0F1419;
            --slate-800: #1E2329;
            --slate-700: #2A3039;
            --slate-600: #3A424D;
            --slate-300: #8B92A0;

            /* Easing curves (Emil Kowalski) */
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

            /* Typography */
            --font-display: 'Space Grotesk', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: var(--font-body);
            background-color: var(--slate-950);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background-color: var(--slate-800);
            padding: 0;
            overflow-y: auto;
            z-index: 1000;
            border-right: 1px solid var(--slate-700);
        }

        .sidebar-header {
            padding: 24px 20px 20px;
            border-bottom: 1px solid var(--slate-700);
            background: linear-gradient(180deg, var(--slate-800) 0%, var(--slate-800) 100%);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--transport-red);
            border-radius: 50%;
            position: relative;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .pulse-dot::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background-color: var(--transport-red);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2.5);
            }
        }

        .live-label {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--transport-red);
        }

        .sidebar-title {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            color: var(--slate-300);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
        }

        .bus-count {
            font-family: var(--font-mono);
            font-size: 32px;
            font-weight: 500;
            color: #ffffff;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        #route-list {
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .route-item {
            padding: 0;
            background-color: transparent;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: stretch;
            gap: 0;
            border: 1px solid var(--slate-700);
            overflow: hidden;
            transition: border-color 180ms var(--ease-out),
                        transform 160ms var(--ease-out);
            user-select: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .route-item:hover {
                border-color: var(--slate-600);
                transform: translateX(2px);
            }
        }

        .route-item:active {
            transform: scale(0.98);
        }

        .route-item.active {
            border-color: white;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .route-color {
            width: 48px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .route-color::before {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0.15;
        }

        .route-number {
            font-family: var(--font-mono);
            font-size: 15px;
            font-weight: 500;
            color: white;
            position: relative;
            z-index: 1;
        }

        .route-info {
            flex: 1;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--slate-700);
        }

        .route-label {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            color: white;
        }

        .route-count {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
            color: var(--slate-300);
            font-variant-numeric: tabular-nums;
        }

        #map {
            height: 100%;
            width: 100%;
            margin-left: 280px;
            width: calc(100% - 280px);
        }

        .leaflet-marker-icon {
            transition: transform 3s var(--ease-out),
                        opacity 300ms var(--ease-out);
        }
    </style>
</head>
    <body>
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="live-indicator">
                    <div class="pulse-dot"></div>
                    <span class="live-label">Live</span>
                </div>
                <div class="sidebar-title">Active Buses</div>
                <div class="bus-count" id="total-bus-count">0</div>
            </div>
            <div id="route-list"></div>
        </div>
        <div id="map"></div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="app.js"></script>
    </body>
</html>
